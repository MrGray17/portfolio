<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Yazid Hammoubel</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d0d0d0}#portfolio-frame{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
  <iframe id="portfolio-frame" src="original.html" title="El Yazid Hammoubel portfolio"></iframe>
  <script>
    const frame = document.getElementById('portfolio-frame');
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc) return;
      const css = doc.createElement('link'); css.rel='stylesheet'; css.href='experience-preview.css'; doc.head.appendChild(css);
      const app = doc.createElement('script'); app.src='portfolio-experience.js';
      app.onload = () => { const fix = doc.createElement('script'); fix.src='experience-overrides.js'; doc.body.appendChild(fix); };
      doc.body.appendChild(app);
    });
  </script>
</body>
</html>
