<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Yazid Hammoubel</title>
  <style>
    html,body{margin:0;min-height:100%;background:#d0d0d0}
    .boot-error{font-family:monospace;margin:40px;padding:24px;border:4px solid #000;background:#ffd93d;box-shadow:8px 8px 0 #000}
  </style>
</head>
<body>
  <script>
    fetch('original.html?portfolio=' + Date.now())
      .then((response) => {
        if (!response.ok) throw new Error('Could not load original portfolio');
        return response.text();
      })
      .then((html) => {
        const withStyles = html.replace(
          '</head>',
          '<link rel="stylesheet" href="experience-preview.css?v=4"></head>'
        );
        const gameScript = '<script src="portfolio-experience.js?v=4"></' + 'script>';
        const withExperience = withStyles.replace('</body>', gameScript + '</body>');
        document.open();
        document.write(withExperience);
        document.close();
      })
      .catch((error) => {
        document.body.replaceChildren();
        const box = document.createElement('div');
        box.className = 'boot-error';
        box.textContent = 'Portfolio failed to load: ' + error.message;
        document.body.append(box);
      });
  </script>
</body>
</html>
