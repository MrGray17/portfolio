name: Set Pages URL

on:
  push:
    branches: [portfolio-experience-safe]
    paths:
      - 'scripts/set_pages_url.py'
      - '.github/workflows/set-pages-url.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-experience-safe

      - name: Apply GitHub Pages URL
        run: python3 scripts/set_pages_url.py

      - name: Verify metadata
        run: |
          grep -q 'https://mrgray17.github.io/portfolio/' index.html
          grep -q 'https://mrgray17.github.io/portfolio/image/img3.jpg' index.html
          grep -q "const currentUrl = 'https://mrgray17.github.io/portfolio/';" seo-fixed.js

      - name: Commit production metadata
        run: |
          git config user.name 'portfolio-qa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html seo-fixed.js
          if git diff --cached --quiet; then
            echo 'No metadata changes needed.'
          else
            git commit -m 'chore: set GitHub Pages production URLs'
            git push origin HEAD:portfolio-experience-safe
          fi
