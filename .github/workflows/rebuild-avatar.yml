name: Rebuild portfolio avatar

on:
  push:
    branches: [main]
    paths:
      - '.avatar-upload/**'
      - '.github/workflows/rebuild-avatar.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify avatar
        shell: bash
        run: |
          cat .avatar-upload/chunk-*.txt | base64 --decode > image/profile-avatar.webp
          actual="$(sha256sum image/profile-avatar.webp | awk '{print $1}')"
          expected="63256ce4585a74ab807da99cccfc4c16076646ba56181c4033fbdff991fc930d"
          test "$actual" = "$expected"
          test "$(wc -c < image/profile-avatar.webp)" -eq 49262
          rm -rf .avatar-upload
          rm .github/workflows/rebuild-avatar.yml

      - name: Commit verified avatar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A image/profile-avatar.webp .avatar-upload .github/workflows/rebuild-avatar.yml
          git commit -m "fix: install full-quality portfolio avatar"
          git push
