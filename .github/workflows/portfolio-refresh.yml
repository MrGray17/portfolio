name: One-shot portfolio refresh

on:
  push:
    branches: [portfolio-real-projects]
    paths:
      - .github/workflows/portfolio-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-real-projects

      - name: Replace template claims with real projects and skills
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, got {count}")
              return updated

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")

          # Public metadata: keep the positioning broad, remove technologies that are not defensible yet.
          index = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="Engineering student building full-stack and systems projects with TypeScript, JavaScript, Python, C, SQL, React, Node.js, Express and PostgreSQL.">', index, count=1)
          index = re.sub(r'<meta name="keywords" content="[^"]*">', '<meta name="keywords" content="El Yazid Hammoubel, Software Engineer, Full-Stack Developer, Systems, TypeScript, JavaScript, Python, C, SQL, HTML, CSS, React, Node.js, Express, PostgreSQL, ENSA Kenitra">', index, count=1)
          index = re.sub(r'<meta property="og:description" content="[^"]*">', '<meta property="og:description" content="Engineering student building real full-stack, backend and systems projects.">', index, count=1)
          index = re.sub(r'<meta property="twitter:description" content="[^"]*">', '<meta property="twitter:description" content="Engineering student building real full-stack, backend and systems projects.">', index, count=1)
          index = index.replace('https://github.com/hammoubelyazid', 'https://github.com/MrGray17')
          index = re.sub(r'\s*"telephone": "[^"]*",\n', '\n', index, count=1)
          index = re.sub(r'"knowsAbout": \[[^\]]*\]', '"knowsAbout": ["Software Engineering", "Full-Stack Development", "Systems", "Networks", "Python", "C", "JavaScript", "TypeScript", "HTML", "CSS", "SQL", "Node.js", "Express", "React", "PostgreSQL", "Git"]', index, count=1)

          # Remove the original author's Awwwards ribbon; keeping it would imply an award this portfolio did not receive.
          index = sub_once(
              index,
              r'\n\s*<!-- Awwwards Ribbon -->.*?</div>\s*\n\s*<!-- Loading Screen -->',
              '\n\n    <!-- Loading Screen -->',
              'Awwwards ribbon',
              re.S,
          )

          tech_badges = '''<div class="tech-badges">
            <span class="tech-badge"><i class="fab fa-python"></i> Python</span>
            <span class="tech-badge"><i class="fas fa-code"></i> C</span>
            <span class="tech-badge"><i class="fab fa-js"></i> JavaScript</span>
            <span class="tech-badge"><i class="fab fa-js"></i> TypeScript</span>
            <span class="tech-badge"><i class="fab fa-html5"></i> HTML</span>
            <span class="tech-badge"><i class="fab fa-css3-alt"></i> CSS</span>
            <span class="tech-badge"><i class="fas fa-database"></i> SQL</span>
            <span class="tech-badge"><i class="fab fa-node-js"></i> Node.js / Express</span>
            <span class="tech-badge"><i class="fab fa-react"></i> React</span>
            <span class="tech-badge"><i class="fas fa-database"></i> PostgreSQL</span>
            <span class="tech-badge"><i class="fab fa-git-alt"></i> Git / GitHub</span>
            <span class="tech-badge"><i class="fab fa-linux"></i> Linux & Networks</span>
        </div>'''
          index = sub_once(index, r'<div class="tech-badges">.*?</div>', tech_badges, 'tech badges', re.S)

          rate_timeline = '''<div class="timeline-item-flat" id="exp-2" data-country="Morocco">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content-flat">
                        <h4 class="timeline-title">Rate Limiter — Backend & Systems Project</h4>
                        <p class="timeline-date">2026 - Present</p>
                        <p class="timeline-description">
                            Building a TypeScript/Node.js rate limiter from first principles, with HTTP integration and tests around request limits, rejection and window reset behavior.
                        </p>
                        <p class="timeline-location"><i class="fas fa-map-marker-alt"></i> Morocco</p>
                    </div>
                </div>'''
          index = sub_once(index, r'<div class="timeline-item-flat" id="exp-2".*?</div>\s*</div>', rate_timeline, 'timeline exp-2', re.S)

          maw3id_timeline = '''<div class="timeline-item-flat" id="exp-3" data-country="Morocco">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content-flat">
                        <h4 class="timeline-title">Maw3id — Full-Stack Clinic Queue Platform</h4>
                        <p class="timeline-date">2026 - Present</p>
                        <p class="timeline-description">
                            Building a clinic queue and appointment product for Morocco with React/TypeScript, Express and PostgreSQL, including queue workflows and nearby-doctor mapping.
                        </p>
                        <p class="timeline-location"><i class="fas fa-map-marker-alt"></i> Morocco</p>
                    </div>
                </div>'''
          index = sub_once(index, r'<div class="timeline-item-flat" id="exp-3".*?</div>\s*</div>', maw3id_timeline, 'timeline exp-3', re.S)

          projects_section = '''<section class="section section-compact" id="projects">
            <div class="creator-showcase">
                <p class="creator-label">Projects I'm Actually Building</p>
                <div class="creator-projects-grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
                    <div class="creator-item">
                        <a href="https://github.com/MrGray17/rate-limiter" target="_blank" class="creator-project">
                            <span class="creator-name"><i class="fas fa-gauge-high"></i> Rate Limiter</span>
                        </a>
                        <p class="creator-tagline">TypeScript + Node.js rate limiter built from scratch. Current work covers fixed-window behavior, HTTP integration and tests; next steps are additional algorithms, distributed state and benchmarking.</p>
                        <a href="https://github.com/MrGray17/rate-limiter" target="_blank" class="creator-github"><i class="fab fa-github"></i> View Project</a>
                    </div>
                    <div class="creator-item">
                        <a href="https://github.com/MrGray17/Maw3id" target="_blank" class="creator-project">
                            <span class="creator-name"><i class="fas fa-hospital-user"></i> Maw3id</span>
                        </a>
                        <p class="creator-tagline">Clinic queue and appointment platform for Morocco. React + TypeScript frontend, Express API, PostgreSQL, testing, and map-based nearby-doctor discovery.</p>
                        <a href="https://github.com/MrGray17/Maw3id" target="_blank" class="creator-github"><i class="fab fa-github"></i> View Project</a>
                    </div>
                    <div class="creator-item">
                        <a href="https://github.com/MrGray17/opentoken" target="_blank" class="creator-project">
                            <span class="creator-name"><i class="fas fa-compress-alt"></i> OpenToken</span>
                        </a>
                        <p class="creator-tagline">Open-source TypeScript/Bun monorepo exploring token-compression tooling for AI workflows, with automated type checking, linting and tests.</p>
                        <a href="https://github.com/MrGray17/opentoken" target="_blank" class="creator-github"><i class="fab fa-github"></i> View Project</a>
                    </div>
                </div>
            </div>
        </section>'''
          index = sub_once(index, r'<section class="section section-compact" id="projects">.*?</section>', projects_section, 'projects section', re.S)

          index = re.sub(
              r"company: 'Neuro-Mesh & AEGIS',\s*period: '2024 - Present',\s*role: 'Security Fabric & AI Systems Lead'",
              "company: 'Rate Limiter / Maw3id / OpenToken',\n                        period: '2026 - Present',\n                        role: 'Software Projects'",
              index,
              count=1,
          )

          index_path.write_text(index, encoding="utf-8")

          script_path = Path("script.js")
          script = script_path.read_text(encoding="utf-8")

          projects_method = '''  loadProjects() {
    this.projects = [
      {
        title: "Rate Limiter",
        description: "TypeScript/Node.js rate limiter built from first principles with HTTP integration and tests for request limits, rejection and window reset behavior. Ongoing work: more algorithms, distributed state and benchmarks.",
        image: "image/avatar-gpt.png",
        technologies: ["TypeScript", "Node.js", "HTTP", "Testing"],
        demo: "https://github.com/MrGray17/rate-limiter",
        repo: "https://github.com/MrGray17/rate-limiter",
      },
      {
        title: "Maw3id",
        description: "Clinic queue and appointment platform for Morocco with queue workflows and nearby-doctor discovery.",
        image: "image/avatar-gpt.png",
        technologies: ["React", "TypeScript", "Express", "PostgreSQL", "MapLibre"],
        demo: "https://github.com/MrGray17/Maw3id",
        repo: "https://github.com/MrGray17/Maw3id",
      },
      {
        title: "OpenToken",
        description: "Open-source token-compression tooling for AI workflows in a TypeScript/Bun monorepo with type checking, linting and tests.",
        image: "image/avatar-gpt.png",
        technologies: ["TypeScript", "Bun", "Testing", "Open Source"],
        demo: "https://github.com/MrGray17/opentoken",
        repo: "https://github.com/MrGray17/opentoken",
      },
    ];
  }

'''
          script = sub_once(script, r'  loadProjects\(\) \{.*?\n  \}\n\n(?=  loadSkills\(\))', projects_method, 'terminal projects', re.S)

          skills_method = '''  loadSkills() {
    this.skills = {
      languages: {
        Python: 72,
        C: 68,
        JavaScript: 72,
        TypeScript: 62,
        SQL: 70,
        "HTML / CSS": 78,
      },
      web_backend: {
        "Node.js / Express": 66,
        React: 58,
        PostgreSQL: 64,
      },
      foundations_tools: {
        "Git / GitHub": 72,
        Linux: 62,
        "Networks & Telecoms": 70,
      },
    };
  }

'''
          script = sub_once(script, r'  loadSkills\(\) \{.*?\n  \}\n\n(?=  setupFileSystem\(\))', skills_method, 'terminal skills data', re.S)

          experience_method = '''  showExperience(outputElement = this.output) {
    const experience = `<span style="color: #ffff00; font-weight: bold;">💼 Experience & Current Build Work</span>

<span style="color: #00ffff;">Atos | Engineering Internship Project</span>
${this.wrapWithColor("2026 | Morocco", "#ffffff")}
${this.wrapWithColor("Worked on automation around a Maroc Telecom Jira workflow, including an AI-assisted component and PostgreSQL-backed data handling.", "#98fb98")}

<span style="color: #00ffff;">Current Engineering Projects</span>
• ${this.wrapWithColor("Rate Limiter", "#ffa07a")} - ${this.wrapWithColor("TypeScript/Node.js backend and systems learning project.", "#ffffff")}
• ${this.wrapWithColor("Maw3id", "#ffa07a")} - ${this.wrapWithColor("React/TypeScript + Express/PostgreSQL clinic queue platform.", "#ffffff")}
• ${this.wrapWithColor("OpenToken", "#ffa07a")} - ${this.wrapWithColor("TypeScript/Bun open-source AI tooling project.", "#ffffff")}`;

    const experienceDiv = document.createElement("div");
    experienceDiv.innerHTML = experience;
    outputElement.appendChild(experienceDiv);
    this.scrollToBottom(outputElement.closest(".terminal-content"));
  }

'''
          script = sub_once(script, r'  showExperience\(outputElement = this\.output\) \{.*?\n  \}\n\n(?=  showEducation\()', experience_method, 'terminal experience', re.S)

          education_method = '''  showEducation(outputElement = this.output) {
    const education = `<span style="color: #ff8c00; font-weight: bold;">🎓 Education</span>

${this.wrapWithColor("ENSA Kénitra", "#ffffff")}
${this.wrapWithColor("Cycle Ingénieur — Réseaux & Télécommunications", "#98fb98")}
${this.wrapWithColor("2025 - Present | Kénitra, Morocco", "#ffffff")}

${this.wrapWithColor("Certifications", "#ff8c00")}
• Google Cybersecurity Professional Certificate
• IBM QRadar SIEM Foundation`;

    const educationDiv = document.createElement("div");
    educationDiv.innerHTML = education;
    outputElement.appendChild(educationDiv);
    this.scrollToBottom(outputElement.closest(".terminal-content"));
  }

'''
          script = sub_once(script, r'  showEducation\(outputElement = this\.output\) \{.*?\n  \}\n\n(?=  showSkills\()', education_method, 'terminal education', re.S)

          skills_command = '''  showSkills(outputElement = this.output) {
    const skills = `<span style="color: #ffff00; font-weight: bold;">🛠️ TECHNOLOGIES I USE</span>

• ${this.wrapWithColor("Python", "#ffffff")}
• ${this.wrapWithColor("C", "#ffffff")}
• ${this.wrapWithColor("JavaScript", "#ffffff")}
• ${this.wrapWithColor("TypeScript", "#ffffff")}
• ${this.wrapWithColor("HTML & CSS", "#ffffff")}
• ${this.wrapWithColor("SQL", "#ffffff")}
• ${this.wrapWithColor("Node.js & Express", "#ffffff")}
• ${this.wrapWithColor("React", "#ffffff")}
• ${this.wrapWithColor("PostgreSQL", "#ffffff")}
• ${this.wrapWithColor("Git & GitHub", "#ffffff")}
• ${this.wrapWithColor("Linux", "#ffffff")}
• ${this.wrapWithColor("Networks & Telecoms", "#ffffff")}`;

    const skillsDiv = document.createElement("div");
    skillsDiv.innerHTML = skills;
    outputElement.appendChild(skillsDiv);
    this.scrollToBottom(outputElement.closest(".terminal-content"));
  }

'''
          script = sub_once(script, r'  showSkills\(outputElement = this\.output\) \{.*?\n  \}\n\n(?=  showContact\()', skills_command, 'terminal skills command', re.S)

          contact_method = '''  showContact(outputElement = this.output) {
    const contact = `<span style="color: #ff8c00; font-weight: bold;">📫 Contact</span>

${this.wrapWithColor("Email:", "#ff8c00")} <a href="mailto:hammoubelyazid@gmail.com" style="color: #ffffff; text-decoration: none;">hammoubelyazid@gmail.com</a>
${this.wrapWithColor("GitHub:", "#ff8c00")} <a href="https://github.com/MrGray17" target="_blank" style="color: #ffffff; text-decoration: none;">github.com/MrGray17</a>
${this.wrapWithColor("Website:", "#ff8c00")} <a href="https://hammoubelyazid.com" target="_blank" style="color: #ffffff; text-decoration: none;">hammoubelyazid.com</a>`;

    const contactDiv = document.createElement("div");
    contactDiv.innerHTML = contact;
    outputElement.appendChild(contactDiv);
    this.scrollToBottom(outputElement.closest(".terminal-content"));
  }

'''
          script = sub_once(script, r'  showContact\(outputElement = this\.output\) \{.*?\n  \}\n\n(?=  showProjects\()', contact_method, 'terminal contact', re.S)

          script = script.replace('marjo@ballabani: ~/interactive-resume', 'eyazid@portfolio: ~/resume')
          script = script.replace('marjoballabani.me', 'hammoubelyazid.com')
          script = script.replace('Software Engineer • Cloud Architect • Tech Lead', 'Software Engineering Student • Full-Stack • Systems')
          script = script.replace('https://github.com/hammoubelyazid', 'https://github.com/MrGray17')

          script_path.write_text(script, encoding="utf-8")

          # Do not leave the one-shot maintenance workflow in the final tree.
          Path('.github/workflows/portfolio-refresh.yml').unlink()

      - name: Commit refreshed portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js .github/workflows/portfolio-refresh.yml
          git commit -m "refactor: make portfolio claims match real work"
          git push origin portfolio-real-projects
