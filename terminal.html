<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Yazid Hammoubel | Terminal</title>
  <meta name="description" content="Interactive terminal view of El Yazid Hammoubel's software engineering portfolio.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="terminal">
    <div class="terminal-header">
      <div class="terminal-buttons">
        <span class="close"></span><span class="minimize"></span><span class="maximize"></span>
      </div>
      <div class="terminal-title">yazid@portfolio: ~/resume</div>
      <div class="terminal-controls">
        <div class="theme-selector" title="Change theme"><i class="fa-solid fa-palette" id="theme-toggle"></i></div>
      </div>
    </div>

    <div class="terminal-container">
      <div class="terminal-content">
        <div id="output"></div>
        <div class="input-line">
          <span class="prompt">➜</span>
          <input type="text" id="command-input" autocomplete="off" autofocus aria-label="Terminal command">
        </div>
      </div>
    </div>

    <div class="terminal-footer">
      <a href="index.html" class="resume-link"><i class="fas fa-arrow-left"></i> Back to Main Portfolio</a>
    </div>
  </div>

  <div id="theme-modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <span class="close-button" role="button" tabindex="0" aria-label="Close">&times;</span>
      <h2>Select Theme</h2>
      <div class="theme-options">
        <div class="theme-option" data-theme="default"><div class="theme-preview default-theme"></div><span>Default</span></div>
        <div class="theme-option" data-theme="dracula"><div class="theme-preview dracula-theme"></div><span>Dracula</span></div>
        <div class="theme-option" data-theme="solarized"><div class="theme-preview solarized-theme"></div><span>Solarized</span></div>
        <div class="theme-option" data-theme="nord"><div class="theme-preview nord-theme"></div><span>Nord</span></div>
      </div>
    </div>
  </div>

  <script src="script.js?v=launch-qa"></script>
</body>
</html>
