<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Yazid Hammoubel — Safe Portfolio Preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d0d0d0}#portfolio-frame{display:block;width:100%;height:100%;border:0}
    #preview-status{position:fixed;left:16px;bottom:16px;z-index:999999;background:#ffd93d;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:8px 12px;font:700 12px/1.2 monospace;pointer-events:none}
  </style>
</head>
<body>
  <iframe id="portfolio-frame" src="index.html" title="Customized portfolio preview"></iframe>
  <div id="preview-status">SAFE PREVIEW · ORIGINAL index.html UNTOUCHED</div>
  <script>
    const frame = document.getElementById('portfolio-frame');
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc || doc.documentElement.dataset.experienceInjected === 'true') return;
      doc.documentElement.dataset.experienceInjected = 'true';

      const style = doc.createElement('link');
      style.rel = 'stylesheet';
      style.href = 'experience-preview.css';
      doc.head.appendChild(style);

      const script = doc.createElement('script');
      script.src = 'portfolio-experience.js';
      script.defer = true;
      doc.body.appendChild(script);
    });
  </script>
</body>
</html>
